<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Meme Zone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1e1e1e; /* Màu nền tối giống theme VS Code */
      color: #cccccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      background-color: #252526;
      border: 1px solid #3c3c3c;
      border-radius: 8px;
      padding: 20px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: #61afef;
    }

    .meme-box {
      width: 100%;
      min-height: 250px;
      max-height: 400px;
      background-color: #181818;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .meme-box img {
      max-width: 100%;
      max-height: 400px;
      object-fit: contain;
    }

    .meme-title {
      font-size: 0.9rem;
      margin-bottom: 15px;
      color: #abb2bf;
    }

    button {
      background-color: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #1177bb;
    }

    button:disabled {
      background-color: #4d4d4d;
      cursor: not-allowed;
    }

    .loader {
      border: 4px solid #333;
      border-top: 4px solid #61afef;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>☕ Đang Fix Bug Chán Sáng Lại Xem Meme</h2>
    <div class="meme-title" id="title">Đang tải meme lập trình...</div>
    
    <div class="meme-box" id="memeBox">
      <div class="loader" id="loader"></div>
      <img id="memeImg" src="" alt="Meme" style="display: none;">
    </div>

    <button id="nextBtn" onclick="fetchMeme()">Meme Tiếp Theo 🔄</button>
  </div>

  <script>
    async function fetchMeme() {
      const img = document.getElementById('memeImg');
      const loader = document.getElementById('loader');
      const title = document.getElementById('title');
      const btn = document.getElementById('nextBtn');

      // Reset giao diện về trạng thái loading
      img.style.display = 'none';
      loader.style.display = 'block';
      btn.disabled = true;
      title.innerText = 'Đang tìm meme mới...';

      try {
        // Lấy meme lập trình từ Reddit API ngẫu nhiên
        const response = await fetch('https://meme-api.com/gimme/ProgrammerHumor');
        const data = await response.json();

        if (data.url) {
          img.src = data.url;
          title.innerText = data.title;
          
          img.onload = () => {
            loader.style.display = 'none';
            img.style.display = 'block';
            btn.disabled = false;
          };
        } else {
          throw new Error('Không thể lấy được hình ảnh');
        }
      } catch (error) {
        title.innerText = 'Không tải được meme. Thử lại sau!';
        loader.style.display = 'none';
        btn.disabled = false;
      }
    }

    // Tải 1 meme ngay khi mở trang
    fetchMeme();
  </script>
</body>
</html>
